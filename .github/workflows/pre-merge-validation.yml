name: Pre-Merge Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, feature/**, skill/**]

jobs:
  pre-merge-checks:
    name: Pre-Merge Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run pre-commit validation
        run: |
          chmod +x scripts/pre-commit-validate.sh
          ./scripts/pre-commit-validate.sh

      - name: Check for merge conflicts markers
        run: |
          if grep -r '<<<<<<< HEAD\|=======\|>>>>>>>' --include="*.md" --include="*.json" --include="*.js" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "❌ Merge conflict markers found"
            exit 1
          fi
          echo "✅ No merge conflict markers"

      - name: Validate manifest structure
        run: |
          node -e "
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          if (!manifest.skills || !manifest.skills['app-dev']) {
            console.error('❌ Invalid manifest structure');
            process.exit(1);
          }

          console.log('✅ Manifest structure valid');
          "

      - name: Check for TODO/FIXME in production code
        run: |
          if git grep -n 'TODO\|FIXME\|XXX' -- '*.js' ':!*test*' ':!scripts/*' 2>/dev/null; then
            echo "⚠️  TODO/FIXME found in production code (warning only)"
          fi
