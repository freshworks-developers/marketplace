name: Manual skill evals

# Supplemental — does not gate PRs. Layer 4 (LLM) runs only when claude/cursor
# CLI is available on the runner; otherwise static + regex (layers 2–3) still run
# and all-tests-report.html is uploaded. See tests/TESTING.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to evaluate (branch, tag, or SHA)
        required: false
        default: main
        type: string

concurrency:
  group: eval-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Skill evals (layers 2–4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm install
        working-directory: tests

      - name: Run eval suite (static + regex + LLM when CLI available)
        run: npm run eval
        working-directory: tests

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: all-tests-report-${{ github.run_id }}
          path: tests/all-tests-report.html
          if-no-files-found: error
          retention-days: 30
