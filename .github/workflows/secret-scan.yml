name: Secret Scan

# Uses the open-source gitleaks CLI (MIT) — no gitleaks-action / GITLEAKS_LICENSE required.
# Org GitHub Secret Scanning + push protection can complement this when enabled.

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect secrets (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan repository
        run: ./gitleaks detect --source . --redact --exit-code 1
