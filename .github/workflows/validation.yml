name: Validation

on:
  push:
    branches: [main, feature/**, skill/**]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate skill manifests
        run: |
          echo "Validating skill structure..."

          # Check required files exist
          for skill in skills/*/; do
            skill_name=$(basename "$skill")
            echo "Checking $skill_name..."

            if [ ! -f "$skill/SKILL.md" ]; then
              echo "❌ Missing SKILL.md in $skill_name"
              exit 1
            fi

            if [ ! -f "$skill/README.md" ]; then
              echo "❌ Missing README.md in $skill_name"
              exit 1
            fi

            echo "✅ $skill_name structure valid"
          done

      - name: Validate manifest.json
        run: |
          if [ -f "manifest.json" ]; then
            node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
            echo "✅ manifest.json is valid JSON"
          fi

  lint:
    name: Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for large files
        run: |
          echo "Checking for files larger than 1MB..."
          large_files=$(find . -type f -size +1M -not -path "./.git/*" -not -path "./node_modules/*")
          if [ -n "$large_files" ]; then
            echo "❌ Large files detected:"
            echo "$large_files"
            exit 1
          fi
          echo "✅ No large files detected"

      - name: Check for trailing whitespace
        run: |
          echo "Checking for trailing whitespace..."
          if git grep -n '[[:space:]]$' -- '*.md' '*.json' '*.yml' '*.js' '*.mdc' 2>/dev/null; then
            echo "❌ Files with trailing whitespace found"
            exit 1
          fi
          echo "✅ No trailing whitespace"

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read file; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $file"
              exit 1
            fi
          done
          echo "✅ All JSON files valid"

      - name: Check for secrets patterns
        run: |
          echo "Checking for common secret patterns..."
          patterns=(
            "-----BEGIN (RSA|DSA|EC|OPENSSH) PRIVATE KEY-----"
            "AKIA[0-9A-Z]{16}"
            "ghp_[0-9a-zA-Z]{36}"
            "gho_[0-9a-zA-Z]{36}"
            "sk_live_[0-9a-zA-Z]{24}"
            "xox[baprs]-[0-9a-zA-Z-]{10,48}"
          )

          found_secrets=false
          for pattern in "${patterns[@]}"; do
            if git grep -E "$pattern" -- '*.md' '*.json' '*.js' '*.yml' 2>/dev/null | grep -v "\.git/"; then
              echo "❌ Potential secret pattern found: $pattern"
              found_secrets=true
            fi
          done

          if [ "$found_secrets" = true ]; then
            exit 1
          fi
          echo "✅ No secret patterns detected"
